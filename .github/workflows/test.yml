name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Verify imports
        run: |
          python -c "
          from src.models.model import build_pipeline, build_stacking_ensemble, bootstrap_ci, explain_districts
          from src.features.features import build_feature_matrix, build_winners
          from src.models.forecast import run_forecast
          from src.data.loaders import load_clean_house_data
          print('All imports OK')
          "

      - name: Type check (mypy)
        run: mypy src/ api.py app.py --install-types --non-interactive

      # Most tests need data files (data/raw/1976-2024-house.tab etc.) not committed to the
      # repo — conftest.py pytest.skip()s those, so some tests are always skipped here.
      # The synthetic-data tests (test_unit.py, test_api.py, test_app.py, test_fundraising.py,
      # test_database.py, test_narrative.py, test_rag.py, parts of test_features.py) still run.
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
