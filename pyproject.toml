[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "us-elections"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: slow end-to-end tests that start real servers (Streamlit + FastAPI) and drive them with a real headless browser. Opt-in only (`make test-e2e`) - excluded from the default suite by addopts above. Needs `pip install -r requirements-dev.txt` and a one-time `playwright install chromium`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# pandas/sklearn-heavy code isn't annotated densely enough yet for --strict;
# this is a floor to build on, not a ceiling.
disallow_untyped_defs = false
exclude = ["notebooks/"]
