[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "us-elections"
version = "0.1.0"

[tool.setuptools]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
